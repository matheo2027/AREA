name: action
run-name: ${{ github.actor }} asking for main action
on:
  push:
    branches-ignore:
      - "ga-ignore-*"
  pull_request:
    branches-ignore:
      - "ga-ignore-*"

jobs:
  auto_format:
    name: Auto Format Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GH repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Astyle
        run: sudo apt-get install -y astyle

      - name: Run Astyle
        run: |
          find . -name "*.cpp" -o -name "*.hpp" | xargs astyle --style=allman

  push_to_mirror:
    name: Push to Mirror
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GH repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ vars.MIRROR_URL }}
          ssh_private_key: ${{ secrets.AREA }}